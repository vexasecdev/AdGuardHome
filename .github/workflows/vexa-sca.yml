name: Vexa Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  vexa-scan:
    name: Run Vexa Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Vexa Security Scan
        uses: noviqtechnologies/vexa-sca@v1.3.5
        with:
          token: ${{ secrets.VEXA_SECURITY_API_KEY }}
          api-url: 'https://vexa-dev-514014.web.app/v1'
          fail-on: high
          upload-sarif: 'true'
          sast: 'true'
          secrets: 'true'
